[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsletter"]

[project]
name = "newsletter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "async-lru>=2.1.0",
    "diskcache>=5.6.3",
    "logfire[requests,httpx,system-metrics,sqlite3,redis]>=4.19.0",
    "opentelemetry-instrumentation-botocore>=0.60b1",
    "opentelemetry-instrumentation-redis>=0.60b1",
    "opentelemetry-instrumentation-starlette>=0.60b1",
    "opentelemetry-instrumentation-tornado>=0.60b1",
    "polars>=1.37.1;platform_system!='Windows'",
    "polars[timezone]>=1.37.1;platform_system=='Windows'",
    "pydantic-ai>=1.43.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "ipykernel>=7.1.0",
    "marimo>=0.19.4",
    "matplotlib>=3.10.8",
    "pytest>=9.0.2",
]

[tool.mypy]
explicit_package_bases=true

[tool.logfire]
pydantic_plugin_record = "all"
